spring:
  spring:
    jpa:
      hibernate:
        ddl-auto: create-drop  # or update for development
  application:
    name: Bank
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Specify the schemas explicitly (optional)
    schemas: public
  datasource:
    url: jdbc:postgresql://localhost:5432/bankdb
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
    server:
      port: 8080
      address: 0.0.0.0   # Listening to all network interfaces